[package]
name = "pathland-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pathland host-side reader: consumes the opcode ring and builds a native-element description for renderers (GTK, DOM, HTML)"
repository = "https://github.com/michaelkrog/Pathland"
categories = ["graphics"]
keywords = ["ui", "opcode", "ring-buffer", "wasm"]

[dependencies]
pathland-opcode = { path = "../pathland-opcode" }
pathland-engine = { path = "../pathland-engine" }
