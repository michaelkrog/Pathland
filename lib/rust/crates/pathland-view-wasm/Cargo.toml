[package]
name = "pathland-view-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Pathland WASM projection (retained UI): the WASM component that retains the view tree and emits declarative TREE/STYLE opcodes via the pathland WIT world"

[dependencies]
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"] }
pathland-core = { path = "../pathland-core" }
pathland-core-transport = { path = "../pathland-core-transport" }
pathland-view = { path = "../pathland-view" }

[lib]
name = "pathland_wasm"
crate-type = ["cdylib"]

[package.metadata.component]
package = "pathland:view"
target = { path = "../../../../wit", world = "pathland" }

[package.metadata.component.bindings]
derives = ["PartialEq"]

[package.metadata.component.dependencies]
