[package]
name = "pathland-render-gtk"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Pathland GTK4 renderer: maps opcode frames onto native GTK widgets incrementally, plus a C ABI for Java hosts"
publish = false

[lib]
name = "pathland_gtk"
crate-type = ["cdylib", "rlib"]

[dependencies]
pathland-core = { path = "../pathland-core" }
pathland-core-transport = { path = "../pathland-core-transport" }
pathland-view-native = { path = "../pathland-view-native" }
gtk = { package = "gtk4", version = "0.9" }
glib = "0.20"
pango = "0.20"

[dev-dependencies]
pathland-view = { path = "../pathland-view" }
