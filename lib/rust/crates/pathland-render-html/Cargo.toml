[package]
name = "pathland-render-html"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pathland HTML renderer: maps opcode frames onto declarative HTML elements"
repository = "https://github.com/michaelkrog/Pathland"
categories = ["rendering", "web-programming"]
keywords = ["ui", "protocol", "opcode", "html", "ssr"]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# Embed the per-platform Tailwind standalone binary in the cdylib (MIT,
# bundled per the pinned license). Off by default so dev/test builds stay fast;
# enable in packaging/release builds. When off, pathland_tailwind_compile falls
# back to a `tailwindcss` binary on PATH or errors gracefully.
default = []
tailwind-embed = []

[dependencies]
pathland-core = { path = "../pathland-core" }
pathland-core-transport = { path = "../pathland-core-transport" }
