[package]
name = "pathland-gtk-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Pathland GTK4 desktop demo: native engine over a zero-copy shared-memory ring, rendering opcodes to GtkBox/GtkLabel/GtkButton"
publish = false

[[bin]]
name = "pathland-gtk-demo"
path = "src/main.rs"

[dependencies]
pathland-opcode = { path = "../pathland-opcode" }
pathland-engine = { path = "../pathland-engine" }
pathland-host = { path = "../pathland-host" }
pathland-transport = { path = "../pathland-transport" }
pathland-view = { path = "../pathland-view" }
gtk = { package = "gtk4", version = "0.9" }
glib = "0.20"
pango = "0.20"
