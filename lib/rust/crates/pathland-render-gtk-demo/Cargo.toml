[package]
name = "pathland-render-gtk-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Pathland GTK4 desktop demo: authors the DSL and renders through the shared pathland-render-gtk renderer (no direct GTK usage)"
publish = false

[[bin]]
name = "pathland-render-gtk-demo"
path = "src/main.rs"

[dependencies]
pathland-core = { path = "../pathland-core" }
pathland-core-transport = { path = "../pathland-core-transport" }
pathland-engine = { path = "../pathland-engine" }
pathland-view = { path = "../pathland-view" }
pathland-render-gtk = { path = "../pathland-render-gtk" }
