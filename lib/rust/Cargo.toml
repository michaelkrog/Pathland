[workspace]
resolver = "2"
members = [
    "crates/pathland-opcode",
    "crates/pathland-view",
    "crates/pathland-engine",
    "crates/pathland-host",
    "crates/pathland-transport",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
