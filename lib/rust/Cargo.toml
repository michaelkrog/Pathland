[workspace]
resolver = "2"
members = [
    "crates/pathland-opcode",
    "crates/pathland-view",
    "crates/pathland-engine",
    "crates/pathland-host",
    "crates/pathland-transport",
    "crates/pathland-guest",
    "crates/pathland-wit-host",
    "crates/pathland-native",
    "crates/pathland-gtk-demo",
    "crates/pathland-codegen",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
