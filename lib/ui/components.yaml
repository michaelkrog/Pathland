# Pathland DSL catalog — single source of truth.
#
# Define a core component once here and the `pathland-codegen` generator emits
# the ergonomic SwiftUI-like DSL in any language (currently Java). The generator
# asserts every id below against `pathland_opcode::constants` and fails the
# build on any mismatch — this YAML and the Rust protocol constants must never
# drift apart.
#
# DSL rules (NON-NEGOTIABLE):
#   - Component CONSTRUCTOR properties are structural/layout, per-component,
#     passed as constructor args, and are NEVER chainable modifiers.
#   - Global MODIFIERS are appearance/decoration and chainable on any view.
#   - `spacing` is a constructor property; `padding` is a modifier (always).
#   - No standalone width/height: use the compound `frame` modifier, which
#     reuses ALIGNMENT (0x0002) and needs no width()/height() sugar.

# ---------------------------------------------------------------------------
# Component ids (must match pathland_opcode::component_type)
# ---------------------------------------------------------------------------
component_ids:
  hstack: 0x0001
  vstack: 0x0002
  text: 0x0003
  button: 0x0004
  image: 0x0005
  switch: 0x0006
  text_field: 0x0007
  spacer: 0x0008
  scrollview: 0x0009
  list: 0x000A
  grid: 0x000B
  comment: 0x000C

# ---------------------------------------------------------------------------
# Property ids (must match pathland_opcode::property_id)
# ---------------------------------------------------------------------------
property_ids:
  # Stack
  spacing: 0x0001
  alignment: 0x0002
  justification: 0x0003
  padding: 0x0004
  content_margins: 0x0005
  # Text
  text: 0x000A
  line_limit: 0x000B
  text_alignment: 0x000C
  truncation_mode: 0x000D
  # Style
  background_color: 0x1001
  border_width: 0x1003
  border_color: 0x1004
  border_radius: 0x1005
  padding_style: 0x1006
  font_size: 0x1007
  font_weight: 0x1008
  font_family: 0x1009
  color: 0x100A
  width: 0x100B
  height: 0x100C
  opacity: 0x100D
  visible: 0x100E
  z_index: 0x100F
  clips_to_bounds: 0x1010
  padding_top: 0x1012
  padding_right: 0x1013
  padding_bottom: 0x1014
  padding_left: 0x1015
  # Semantic
  role: 0x2001
  state: 0x2002
  enabled: 0x2003
  selected: 0x2004

# ---------------------------------------------------------------------------
# Enums (typed DSL values; each maps to a u8 wire value and a property id)
# ---------------------------------------------------------------------------
enums:
  Align:            # stack/container cross-axis + frame alignment
    property: alignment
    values:
      leading: 0
      center: 1
      trailing: 2
      fill: 3
  Justify:          # stack main-axis distribution
    property: justification
    values:
      start: 0
      end: 1
      center: 2
      space_between: 3
      space_around: 4
      space_evenly: 5
  TextAlign:
    property: text_alignment
    values:
      leading: 0
      center: 1
      trailing: 2
  Truncation:
    property: truncation_mode
    values:
      head: 0
      middle: 1
      tail: 2
      none: 3
  FontWeight:
    property: font_weight
    values:
      light: 0
      regular: 1
      medium: 2
      semibold: 3
      bold: 4

# ---------------------------------------------------------------------------
# Components and their CONSTRUCTOR properties (never chainable)
# ---------------------------------------------------------------------------
components:
  hstack:
    label: HStack
    children: true
    constructor_props:
      - property: alignment
        type: enum
        enum: Align
      - property: justification
        type: enum
        enum: Justify
      - property: spacing
        type: f32
  vstack:
    label: VStack
    children: true
    constructor_props:
      - property: alignment
        type: enum
        enum: Align
      - property: justification
        type: enum
        enum: Justify
      - property: spacing
        type: f32
  text:
    label: Text
    text_content: true
    constructor_props:
      - property: text_alignment
        type: enum
        enum: TextAlign
      - property: line_limit
        type: u32
      - property: truncation_mode
        type: enum
        enum: Truncation
  button:
    label: Button
    text_content: true
    constructor_props: []
  image:
    label: Image
    constructor_props: []
  switch:
    label: Switch
    constructor_props: []
  text_field:
    label: TextField
    constructor_props: []
  spacer:
    label: Spacer
    constructor_props: []
  scrollview:
    label: ScrollView
    children: true
    constructor_props: []
  list:
    label: List
    children: true
    constructor_props: []
  grid:
    label: Grid
    children: true
    constructor_props: []
  comment:
    label: Comment
    children: true
    constructor_props: []

# ---------------------------------------------------------------------------
# Global MODIFIERS — chainable on any view (appearance/decoration)
# ---------------------------------------------------------------------------
modifiers:
  - property: padding
    type: f32
  - property: color
    type: color
  - property: background_color
    type: color
  - property: opacity
    type: f32
  - property: border_width
    type: f32
  - property: border_color
    type: color
  - property: border_radius
    type: f32
  - property: font_size
    type: f32
  - property: font_weight
    type: enum
    enum: FontWeight
  - property: font_family
    type: string
  - property: visible
    type: bool
  - property: z_index
    type: f32
  - property: clips_to_bounds
    type: bool

# ---------------------------------------------------------------------------
# Compound modifiers — expand to one or more ordinary properties
# ---------------------------------------------------------------------------
compound_modifiers:
  frame:
    properties:
      - property: width
        type: size
      - property: height
        type: size
      - property: alignment
        type: enum
        enum: Align
