[package]
name = "pathland-roundtrip"
version = "0.1.0"
edition = "2024"
publish = false
description = "Pathland native demo: a WaterUI app rendered directly through the platform backend (no Pathland)"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies.waterui]
path = "../../../waterui"

[dependencies.waterui-ffi]
path = "../../../waterui/ffi"

[workspace]

# WaterUI's dev branch is written against patched vello/wgpu checkouts; mirror
# its [patch.crates-io] here because patches do not propagate across a path
# dependency into an external workspace.
[patch.crates-io]
vello = { git = "https://github.com/lexoliu/vello", branch = "fix-select-index-underflow" }
vello_hybrid = { git = "https://github.com/lexoliu/vello", branch = "fix-select-index-underflow" }
wgpu = { git = "https://github.com/lexoliu/wgpu", branch = "mali-negative-viewport" }
wgpu-core = { git = "https://github.com/lexoliu/wgpu", branch = "mali-negative-viewport" }
wgpu-hal = { git = "https://github.com/lexoliu/wgpu", branch = "mali-negative-viewport" }
wgpu-types = { git = "https://github.com/lexoliu/wgpu", branch = "mali-negative-viewport" }
naga = { git = "https://github.com/lexoliu/wgpu", branch = "mali-negative-viewport" }
