<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pathland POC - New Packages</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }
        
        /* Pathland semantic colors as fallbacks */
        [data-pathland-color="primary"] { color: #0066cc; }
        [data-pathland-color="secondary"] { color: #666666; }
        [data-pathland-background="primary"] { background-color: #0066cc; color: white; }
        [data-pathland-background="surface"] { background-color: white; }
        [data-pathland-background="background"] { background-color: #f5f5f5; }
        [data-pathland-background="success"] { background-color: #4CAF50; color: white; }
        [data-pathland-background="error"] { background-color: #F44336; color: white; }
        
        /* Ensure elements are displayed correctly */
        div, span {
            display: inline-block;
        }
    </style>
</head>
<body>
    <!-- This is where Pathland will render the UI -->
    <app-root></app-root>
    
    <!-- Vite will inject the compiled script here -->
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
